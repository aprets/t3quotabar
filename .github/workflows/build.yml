name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: bash scripts/test.sh
      - name: Build and package
        env:
          CODE_SIGN_IDENTITY: '-'
        run: |
          bash scripts/build-app.sh
          codesign --verify --deep --strict dist/T3QuotaBar.app
          ditto -c -k --sequesterRsrc --keepParent dist/T3QuotaBar.app dist/T3QuotaBar-macOS-arm64.zip
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Automated build from commit ${GITHUB_SHA}.

          Apple Silicon, macOS 14 or newer. Ad-hoc signed, not notarized. Updates may require reconnecting to T3 Code.

          This prerelease is replaced after each successful main build."
          release_tag=$(gh release list --json tagName --jq '.[] | select(.tagName == "latest") | .tagName')
          if [[ "$release_tag" == latest ]]; then
            gh release upload latest dist/T3QuotaBar-macOS-arm64.zip --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --title "Latest build" --notes "$notes" --prerelease
          else
            gh release create latest dist/T3QuotaBar-macOS-arm64.zip --target "$GITHUB_SHA" --title "Latest build" --notes "$notes" --prerelease
          fi
