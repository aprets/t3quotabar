name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: bash scripts/test.sh
      - name: Build and package
        env:
          CODE_SIGN_IDENTITY: '-'
        run: |
          bash scripts/build-app.sh
          codesign --verify --deep --strict dist/T3QuotaBar.app
          ditto -c -k --sequesterRsrc --keepParent dist/T3QuotaBar.app dist/T3QuotaBar-macOS-arm64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/T3QuotaBar-macOS-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
